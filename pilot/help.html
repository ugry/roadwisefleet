<!doctype html>
<html lang="en" data-surface="pilot" data-locales="/pilot/locales/">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title data-i18n="help.documentTitle">Help — RoadwiseFleet</title>
<!-- Board #138 (UXF-DOC2 + FAv1-SUP2b): the pilot help page. Served by the
     pilot static root, cached by sw.js with the rest of the shell so it opens
     offline. Same content table as /app/help (pilot/lib/help-content.js), so
     the two surfaces cannot drift. Pilot CSP allows inline style/script, like
     the dashboard and driver pages. -->
<style>
  :root{
    --navy-950: oklch(0.20 0.04 258);
    --bg: oklch(0.985 0.003 250);
    --surface: oklch(1 0 0);
    --ink: oklch(0.24 0.05 258);
    --muted: oklch(0.48 0.02 255);
    --border: oklch(0.90 0.006 255);
    --accent: oklch(0.80 0.165 82);
    --accent-deep: oklch(0.47 0.130 62);
    --on-dark: oklch(0.985 0.002 250);
    --font-display: "Barlow Condensed", "Arial Narrow", sans-serif;
    --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --shadow-card: 0 1px 2px oklch(0.2 0.04 258 / .05), 0 10px 30px oklch(0.2 0.04 258 / .06);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5}
  header.top{background:var(--navy-950);color:var(--on-dark);padding:16px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header.top .brand{font-family:var(--font-display);font-weight:600;font-size:20px;letter-spacing:.02em;text-transform:uppercase}
  header.top .tag{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
  header.top .spacer{flex:1}
  header.top .lang-slot{display:flex;align-items:center;gap:8px;font-size:12px}
  header.top label.lang{display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.08em;color:var(--on-dark);opacity:.85}
  header.top select.lang-switcher{font-family:inherit;font-size:13px;padding:5px 7px;border-radius:6px;border:1px solid var(--navy-950);
    background:var(--on-dark);color:var(--ink)}
  header.top a.back{color:var(--on-dark);font-size:14px;text-decoration:none;border:1px solid var(--on-dark);border-radius:8px;padding:7px 12px}
  header.top a.back:hover{background:var(--on-dark);color:var(--navy-950)}
  main{max-width:780px;margin:0 auto;padding:32px 20px 60px}
  h1{font-family:var(--font-display);font-weight:600;font-size:32px;letter-spacing:.01em;margin:0 0 8px}
  p.lead{color:var(--muted);margin:0 0 24px}
  .help-toc{background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-card);padding:14px 18px;margin:0 0 26px}
  .help-toc .section-title{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px}
  .help-toc ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px 18px}
  .help-toc a{color:var(--accent-deep);text-decoration:none;font-weight:600}
  .help-section{margin:0 0 30px}
  .help-section h2{font-family:var(--font-display);font-weight:600;font-size:22px;margin:0 0 10px}
  .help-items{margin:0;padding-left:22px}
  .help-items li{margin:0 0 8px}
  .help-statuses{list-style:none;display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px;padding:0}
  .help-statuses li{background:oklch(0.95 0.02 258);color:oklch(0.35 0.05 258);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600}
  p.helper{color:var(--muted);font-size:13px;border-top:1px solid var(--border);padding-top:14px;margin-top:30px}
  :focus-visible{outline:3px solid var(--accent-deep);outline-offset:2px;border-radius:6px}
  @media (pointer:coarse){header.top select.lang-switcher{min-height:44px}}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}
</style>
</head>
<body>
<header class="top">
  <span class="brand" data-i18n="brand.name"></span>
  <span class="tag" data-i18n="common.pilotTag"></span>
  <span class="spacer"></span>
  <span class="lang-slot" id="langSlot"></span>
  <a class="back" id="helpBack" href="index.html" data-i18n="help.backPilot"></a>
</header>
<main>
  <h1 data-i18n="help.title"></h1>
  <p class="lead" data-i18n="help.lead"></p>
  <div id="helpBody"></div>
  <p class="helper" data-i18n="help.contact"></p>
</main>
<script src="/pilot/lib/i18n.js"></script>
<script src="/pilot/lib/i18n-ui.js"></script>
<script src="/pilot/lib/help-content.js"></script>
<script src="/pilot/lib/help-boot.js"></script>
</body>
</html>
