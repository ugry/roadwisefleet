<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoadwiseFleet — Pilot Dashboard</title>
<style>
  :root{
    --navy-950: oklch(0.20 0.04 258);
    --navy-800: oklch(0.30 0.045 258);
    --bg: oklch(0.985 0.003 250);
    --surface: oklch(1 0 0);
    --ink: oklch(0.24 0.05 258);
    --muted: oklch(0.48 0.02 255);
    --border: oklch(0.90 0.006 255);
    --accent: oklch(0.80 0.165 82);
    --accent-deep: oklch(0.47 0.130 62);
    --on-accent: oklch(0.20 0.040 258);
    --on-dark: oklch(0.985 0.002 250);
    --success: oklch(0.56 0.130 158);
    --danger: oklch(0.55 0.190 26);
    --font-display: "Barlow Condensed", "Arial Narrow", sans-serif;
    --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --shadow-card: 0 1px 2px oklch(0.2 0.04 258 / .05), 0 10px 30px oklch(0.2 0.04 258 / .06);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45}
  a{color:var(--accent-deep)}
  header.top{background:var(--navy-950);color:var(--on-dark);padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header.top .brand{font-family:var(--font-display);font-weight:600;font-size:20px;letter-spacing:.02em;text-transform:uppercase}
  header.top .tag{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
  header.top .spacer{flex:1}
  header.top nav a{color:var(--on-dark);opacity:.85;margin-left:14px;text-decoration:none;font-size:13px}
  header.top nav a:hover{opacity:1;text-decoration:underline}
  main{max-width:1100px;margin:0 auto;padding:26px 20px 60px}
  h1{font-family:var(--font-display);font-weight:600;font-size:28px;letter-spacing:.01em;margin:0 0 4px}
  .muted{color:var(--muted);font-size:13px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-card);padding:18px;margin:18px 0}
  .card h2{font-family:var(--font-display);font-weight:600;font-size:18px;margin:0 0 12px;letter-spacing:.01em}
  label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:10px 0 4px}
  input,select{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:7px;font-family:inherit;font-size:14px;background:var(--surface);color:var(--ink)}
  input:focus,select:focus{outline:none;box-shadow:0 0 0 3px oklch(0.80 0.165 82 / .55);border-color:var(--accent)}
  button{font-family:inherit;font-size:14px;font-weight:600;border:1px solid transparent;border-radius:7px;padding:9px 14px;cursor:pointer}
  button.primary{background:var(--accent);color:var(--on-accent)}
  button.primary:hover{filter:brightness(1.05)}
  button.ghost{background:transparent;border-color:var(--border);color:var(--ink)}
  button.small{padding:5px 9px;font-size:12px}
  button:disabled{opacity:.5;cursor:default}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .row>div{flex:1;min-width:160px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
  .status{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.04em;background:var(--bg);border:1px solid var(--border);color:var(--ink);text-transform:uppercase}
  .status.s-DELIVERED,.status.s-POD_UPLOADED,.status.s-INVOICED,.status.s-SETTLED{color:var(--success);border-color:var(--success)}
  .status.s-CANCELLED{color:var(--danger);border-color:var(--danger)}
  .status.s-IN_TRANSIT,.status.s-LOADED{color:var(--accent-deep);border-color:var(--accent-deep)}
  .actions{display:flex;gap:6px;flex-wrap:wrap}
  .msg{padding:10px 12px;border-radius:7px;margin:12px 0;font-size:13px;display:none;white-space:pre-wrap}
  .msg.show{display:block}
  .msg.err{background:oklch(0.55 0.19 26 / .08);border:1px solid var(--danger);color:var(--danger)}
  .msg.ok{background:oklch(0.56 0.13 158 / .10);border:1px solid var(--success);color:oklch(0.40 0.12 158)}
  .hidden{display:none !important}
  .who{font-size:13px;color:var(--muted)}
  tr.clickable{cursor:pointer}
  tr.clickable:hover{background:oklch(0.985 0.003 250)}
  .overlay{position:fixed;inset:0;background:oklch(0.2 0.04 258 / .35);opacity:0;pointer-events:none;transition:opacity .18s ease;z-index:19}
  .overlay.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(560px,100%);background:var(--surface);border-left:1px solid var(--border);box-shadow:-8px 0 30px oklch(0.2 0.04 258 / .18);transform:translateX(102%);transition:transform .18s ease;z-index:20;display:flex;flex-direction:column}
  .drawer.open{transform:none}
  .drawer-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
  .drawer-head h2{font-family:var(--font-display);font-weight:600;font-size:18px;margin:0;flex:1}
  .drawer-body{padding:16px 18px 40px;overflow:auto}
  .section-title{font-family:var(--font-display);font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.05em;margin:18px 0 8px;color:var(--navy-800)}
  .kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:14px;margin:0 0 6px}
  .kv dt{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin:0;padding-top:2px}
  .kv dd{margin:0}
  .timeline{list-style:none;margin:0;padding:0}
  .timeline li{position:relative;padding:0 0 14px 18px;border-left:2px solid var(--border)}
  .timeline li:last-child{border-left-color:transparent}
  .timeline li:before{content:"";position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
  .tl-what{font-weight:600}
  .tl-when{font-size:12px;color:var(--muted)}
  .pnl{font-family:var(--font-display);font-size:22px;margin:0}
  .pnl.pos{color:var(--success)}
  .pnl.neg{color:var(--danger)}
  .empty{color:var(--muted);font-size:13px}
  @media (max-width:640px){ table,thead,tbody,th,td,tr{display:block} thead{display:none} td{border:none;padding:3px 0} tr{border-bottom:1px solid var(--border);padding:8px 0} }
</style>
</head>
<body>
<header class="top">
  <span class="brand">RoadwiseFleet</span>
  <span class="tag">Pilot</span>
  <span class="spacer"></span>
  <nav>
    <a href="driver.html">Driver view</a>
    <a href="index.html">Pilot home</a>
  </nav>
</header>
<main>
  <h1>Dispatch dashboard</h1>
  <p class="muted">Live against the pilot API. Sessions are kept in this tab only.</p>

  <div id="globalMsg" class="msg"></div>

  <section id="loginCard" class="card">
    <h2>Sign in</h2>
    <form id="loginForm" autocomplete="on">
      <div class="row">
        <div>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required autocomplete="username" placeholder="admin@pilot.roadwisefleet.test">
        </div>
        <div>
          <label for="password">Password</label>
          <input id="password" name="password" type="password" required autocomplete="current-password">
        </div>
      </div>
      <div style="margin-top:14px"><button class="primary" type="submit">Sign in</button></div>
    </form>
  </section>

  <section id="app" class="hidden">
    <p class="who">Signed in as <strong id="whoName">—</strong> <span id="whoRole"></span> · <a href="#" id="logout">Sign out</a></p>

    <div class="card" id="createCard">
      <h2>Create trip</h2>
      <form id="createForm">
        <div class="row">
          <div>
            <label for="orderId">Order (required)</label>
            <select id="orderId" name="orderId" required><option value="">Loading…</option></select>
          </div>
          <div>
            <label for="driverId">Driver (optional)</label>
            <select id="driverId" name="driverId"><option value="">— unassigned —</option></select>
          </div>
          <div>
            <label for="truckId">Truck (optional)</label>
            <select id="truckId" name="truckId"><option value="">— unassigned —</option></select>
          </div>
          <div>
            <label for="rateEur">Rate EUR (optional)</label>
            <input id="rateEur" name="rateEur" type="number" min="0" step="0.01" placeholder="1200">
          </div>
        </div>
        <div style="margin-top:14px"><button class="primary" type="submit">Create trip</button></div>
      </form>
    </div>

    <div class="card">
      <h2>Trips</h2>
      <div style="margin-bottom:10px"><button class="ghost small" id="refresh" type="button">Refresh</button></div>
      <table>
        <thead>
          <tr><th>Route</th><th>Driver</th><th>Status</th><th>Rate</th><th>Transition</th></tr>
        </thead>
        <tbody id="tripRows"><tr><td colspan="5" class="muted">Loading…</td></tr></tbody>
      </table>
    </div>
  </section>
</main>

<div id="overlay" class="overlay"></div>
<aside id="drawer" class="drawer" aria-hidden="true" aria-label="Trip detail">
  <div class="drawer-head">
    <h2 id="drawerTitle">Trip detail</h2>
    <button class="ghost small" id="drawerClose" type="button">Close</button>
  </div>
  <div class="drawer-body" id="drawerBody"><p class="muted">Select a trip to see its detail.</p></div>
</aside>

<script>
(function () {
  'use strict';
  var TOKEN_KEY = 'rwf_token';
  var USER_KEY = 'rwf_user';
  // Mirror of apps/api/src/trip-status.js — UI convenience only; the API is authoritative.
  var TRANSITIONS = {
    DRAFT: ['ASSIGNED', 'CANCELLED'],
    ASSIGNED: ['LOADED', 'CANCELLED'],
    LOADED: ['IN_TRANSIT'],
    IN_TRANSIT: ['DELIVERED'],
    DELIVERED: ['POD_UPLOADED'],
    POD_UPLOADED: ['INVOICED'],
    INVOICED: ['SETTLED'],
    SETTLED: [],
    CANCELLED: []
  };

  function $(id) { return document.getElementById(id); }
  function token() { return sessionStorage.getItem(TOKEN_KEY) || ''; }
  function setMsg(text, kind) {
    var el = $('globalMsg');
    el.className = 'msg show ' + (kind || 'err');
    el.textContent = text;
  }
  function clearMsg() { var el = $('globalMsg'); el.className = 'msg'; el.textContent = ''; }

  function errorText(status, data) {
    if (status === 401) return 'Not authorised (401): please sign in again.';
    if (status === 403) return 'Forbidden (403): your role may not perform this action.';
    var code = (data && data.error) || ('http_' + status);
    if (code === 'invalid_transition') return 'Illegal transition (400): ' + data.from + ' -> ' + data.to + '.';
    if (code === 'invalid_status') return 'Unknown status (400).';
    return code + ' (' + status + ')';
  }

  function api(path, opts) {
    opts = opts || {};
    var headers = {};
    if (opts.body) headers['content-type'] = 'application/json';
    if (opts.token) headers['authorization'] = 'Bearer ' + opts.token;
    return fetch(path, {
      method: opts.method || 'GET',
      headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function (res) {
      return res.json().catch(function () { return null; }).then(function (data) {
        return { status: res.status, data: data };
      });
    });
  }

  function money(v) {
    if (v === null || v === undefined || v === '') return '—';
    var n = Number(v);
    return Number.isFinite(n) ? '€' + n.toFixed(2) : '—';
  }

  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function showApp() {
    var user = null;
    try { user = JSON.parse(sessionStorage.getItem(USER_KEY) || 'null'); } catch (e) { user = null; }
    if (user) {
      $('whoName').textContent = user.name || user.email || 'user';
      $('whoRole').textContent = user.roleId ? '(' + user.roleId + ')' : '';
    }
    $('loginCard').classList.add('hidden');
    $('app').classList.remove('hidden');
    loadReference();
    loadTrips();
  }

  function showLogin() {
    $('app').classList.add('hidden');
    $('loginCard').classList.remove('hidden');
  }

  function loadTrips() {
    return api('/api/trips', { token: token() }).then(function (r) {
      if (r.status === 401) { sessionStorage.removeItem(TOKEN_KEY); sessionStorage.removeItem(USER_KEY); showLogin(); setMsg(errorText(r.status, r.data), 'err'); return; }
      if (r.status !== 200) { setMsg(errorText(r.status, r.data), 'err'); return; }
      renderTrips(r.data && r.data.trips ? r.data.trips : []);
    });
  }

  function option(value, label) {
    return '<option value="' + esc(value) + '">' + esc(label) + '</option>';
  }

  // Reference lists for the create-trip form. Only dispatch-capable roles may
  // read them; a driver (403) simply gets the create card hidden.
  function loadReference() {
    return api('/api/reference', { token: token() }).then(function (r) {
      if (r.status === 403) { $('createCard').classList.add('hidden'); return; }
      if (r.status !== 200) { setMsg(errorText(r.status, r.data), 'err'); return; }
      fillReference((r.data && r.data.reference) || {});
    });
  }

  function fillReference(ref) {
    var orders = ref.orders || [];
    var drivers = ref.drivers || [];
    var trucks = ref.trucks || [];
    $('createCard').classList.remove('hidden');

    $('orderId').innerHTML = '<option value="">— select order —</option>' + orders.map(function (o) {
      var customer = o.customer ? o.customer.name : '';
      var label = (customer ? customer + ' · ' : '') +
        (o.origin || '?') + ' → ' + (o.destination || '?') +
        (o.cargo ? ' · ' + o.cargo : '') +
        (o.status ? ' [' + o.status + ']' : '');
      return option(o.id, label);
    }).join('');

    $('driverId').innerHTML = '<option value="">— unassigned —</option>' + drivers.map(function (d) {
      return option(d.id, d.name || d.id);
    }).join('');

    $('truckId').innerHTML = '<option value="">— unassigned —</option>' + trucks.map(function (t) {
      var label = [t.plate, t.euroClass, t.dimensions].filter(Boolean).join(' · ');
      return option(t.id, label || t.id);
    }).join('');

    if (!orders.length) {
      setMsg('No orders available for this org — create an order first.', 'err');
    }
  }

  function renderTrips(trips) {
    var body = $('tripRows');
    if (!trips.length) {
      body.innerHTML = '<tr><td colspan="5" class="muted">No trips yet.</td></tr>';
      return;
    }
    body.innerHTML = trips.map(function (t) {
      var order = t.order || {};
      var route = esc(order.origin || '?') + ' → ' + esc(order.destination || '?');
      var driver = t.driver ? esc(t.driver.name || t.driver.email || t.driverId) : (t.driverId ? esc(t.driverId) : '—');
      var next = TRANSITIONS[t.status] || [];
      var buttons = next.map(function (s) {
        return '<button class="ghost small" data-trip="' + esc(t.id) + '" data-to="' + esc(s) + '">' + esc(s) + '</button>';
      }).join('');
      return '<tr class="clickable" data-open="' + esc(t.id) + '">' +
        '<td>' + route + '</td>' +
        '<td>' + driver + '</td>' +
        '<td><span class="status s-' + esc(t.status) + '">' + esc(t.status) + '</span></td>' +
        '<td>' + money(t.rateEur) + '</td>' +
        '<td><div class="actions">' + (buttons || '<span class="muted">terminal</span>') + '</div></td>' +
      '</tr>';
    }).join('');
    Array.prototype.forEach.call(body.querySelectorAll('button[data-trip]'), function (btn) {
      btn.addEventListener('click', function () {
        transition(btn.getAttribute('data-trip'), btn.getAttribute('data-to'), btn);
      });
    });
    Array.prototype.forEach.call(body.querySelectorAll('tr[data-open]'), function (tr) {
      tr.addEventListener('click', function (ev) {
        // A transition button inside the row must not also open the drawer.
        if (ev.target && ev.target.closest && ev.target.closest('button')) return;
        loadTripDetail(tr.getAttribute('data-open'));
      });
    });
  }

  function fmtDate(v) {
    if (!v) return '—';
    var d = new Date(v);
    return isNaN(d.getTime()) ? String(v) : d.toLocaleString();
  }

  function openDrawer() {
    $('drawer').classList.add('open');
    $('drawer').setAttribute('aria-hidden', 'false');
    $('overlay').classList.add('open');
  }

  function closeDrawer() {
    $('drawer').classList.remove('open');
    $('drawer').setAttribute('aria-hidden', 'true');
    $('overlay').classList.remove('open');
  }

  // Trip detail (board task #2): one read-only GET /api/trips/:id, rendered into
  // the drawer. Org scoping is the API's job; here we only display what it returns.
  function loadTripDetail(id) {
    $('drawerTitle').textContent = 'Trip ' + id;
    $('drawerBody').innerHTML = '<p class="muted">Loading…</p>';
    openDrawer();
    return api('/api/trips/' + encodeURIComponent(id), { token: token() }).then(function (r) {
      if (r.status !== 200) {
        $('drawerBody').innerHTML = '<p class="msg err show">' + esc(errorText(r.status, r.data)) + '</p>';
        return;
      }
      renderTripDetail(r.data && r.data.trip ? r.data.trip : {});
    }).catch(function (err) {
      $('drawerBody').innerHTML = '<p class="msg err show">Network error: ' + esc(err.message) + '</p>';
    });
  }

  function renderTripDetail(t) {
    var order = t.order || {};
    var totals = t.totals || {};
    var pnl = totals.pnlEur;
    var pnlClass = (pnl === null || pnl === undefined) ? '' : (pnl < 0 ? 'neg' : 'pos');

    var events = t.statusEvents || [];
    var timeline = events.length ? '<ul class="timeline">' + events.map(function (e) {
      return '<li>' +
        '<div class="tl-what">' + esc(e.from) + ' → ' + esc(e.to) + '</div>' +
        '<div class="tl-when">' + esc(fmtDate(e.at)) + (e.actor ? ' · ' + esc(e.actor.name) : '') + '</div>' +
      '</li>';
    }).join('') + '</ul>' : '<p class="empty">No status events yet.</p>';

    var docs = t.documents || [];
    var docRows = docs.length ? docs.map(function (d) {
      return '<tr><td>' + esc(d.docType) + '</td><td>' + esc(d.status) + '</td><td>' + esc(fmtDate(d.uploadedAt)) + '</td></tr>';
    }).join('') : '<tr><td colspan="3" class="empty">No documents.</td></tr>';

    var expenses = t.expenses || [];
    var expRows = expenses.length ? expenses.map(function (x) {
      return '<tr><td>' + esc(x.category) + '</td><td>' + money(x.amountEur) + '</td></tr>';
    }).join('') : '<tr><td colspan="2" class="empty">No expenses.</td></tr>';

    $('drawerBody').innerHTML =
      '<p><span class="status s-' + esc(t.status) + '">' + esc(t.status) + '</span></p>' +
      '<dl class="kv">' +
        '<dt>Route</dt><dd>' + esc(order.origin || '?') + ' → ' + esc(order.destination || '?') + '</dd>' +
        '<dt>Cargo</dt><dd>' + esc(order.cargo || '—') + '</dd>' +
        '<dt>Customer</dt><dd>' + esc(order.customer ? order.customer.name : '—') + '</dd>' +
        '<dt>Driver</dt><dd>' + esc(t.driver ? (t.driver.name || t.driver.email || t.driver.id) : '—') + '</dd>' +
        '<dt>Truck</dt><dd>' + esc(t.truck ? (t.truck.plate || t.truck.id) : '—') + '</dd>' +
        '<dt>Rate</dt><dd>' + money(t.rateEur) + '</dd>' +
      '</dl>' +
      '<div class="section-title">Timeline</div>' + timeline +
      '<div class="section-title">Documents</div>' +
        '<table><thead><tr><th>Type</th><th>Status</th><th>Uploaded</th></tr></thead><tbody>' + docRows + '</tbody></table>' +
      '<div class="section-title">Expenses</div>' +
        '<table><thead><tr><th>Category</th><th>Amount</th></tr></thead><tbody>' + expRows + '</tbody></table>' +
      '<div class="section-title">P&amp;L</div>' +
        '<p class="pnl ' + pnlClass + '">' + money(pnl) + '</p>' +
        '<p class="muted">Rate ' + money(t.rateEur) + ' − expenses ' + money(totals.expensesEur) + '</p>' +
      '<div class="section-title">Customer tracking</div>' +
        '<p class="muted">Share a read-only link: route, status and timeline, no login and no PII.</p>' +
        '<button class="ghost small" id="trackLinkBtn" type="button">Create tracking link</button>' +
        '<p class="muted" id="trackLinkOut">No link created yet.</p>';

    // Injected above, so look it up inside the drawer body rather than with the
    // $-helper, which would need the id to exist in the static document.
    var linkBtn = $('drawerBody').querySelector('#trackLinkBtn');
    if (linkBtn) {
      linkBtn.addEventListener('click', function () { createTrackLink(t.id, linkBtn); });
    }
  }

  // Board task #5: mint a shareable, login-free tracking link for this trip.
  // Owner/dispatcher only — the API answers 403 for any other role.
  function createTrackLink(id, btn) {
    btn.disabled = true;
    var out = $('drawerBody').querySelector('#trackLinkOut');
    out.textContent = 'Creating…';
    api('/api/trips/' + encodeURIComponent(id) + '/track-link', { method: 'POST', token: token() })
      .then(function (r) {
        btn.disabled = false;
        if (r.status !== 201) { out.textContent = errorText(r.status, r.data); return; }
        var link = (r.data && r.data.link) || {};
        var url = new URL(link.url, window.location.origin).href;
        out.innerHTML = '<a href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(url) + '</a>';
      })
      .catch(function (err) {
        btn.disabled = false;
        out.textContent = 'Network error: ' + err.message;
      });
  }

  function refreshOpenDrawer(id) {
    if ($('drawer').classList.contains('open') && $('drawerTitle').textContent === 'Trip ' + id) {
      loadTripDetail(id);
    }
  }

  function transition(id, to, btn) {
    clearMsg();
    btn.disabled = true;
    api('/api/trips/' + encodeURIComponent(id) + '/status', { method: 'POST', token: token(), body: { status: to } })
      .then(function (r) {
        if (r.status !== 200) { setMsg(errorText(r.status, r.data), 'err'); }
        else { setMsg('Trip ' + id + ' -> ' + to + '.', 'ok'); }
        return loadTrips().then(function () { refreshOpenDrawer(id); });
      })
      .catch(function (err) { setMsg('Network error: ' + err.message, 'err'); })
      .then(function () { btn.disabled = false; });
  }

  $('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    clearMsg();
    api('/api/auth/login', { method: 'POST', body: { email: $('email').value.trim(), password: $('password').value } })
      .then(function (r) {
        if (r.status !== 200) { setMsg(errorText(r.status, r.data), 'err'); return; }
        sessionStorage.setItem(TOKEN_KEY, r.data.token);
        sessionStorage.setItem(USER_KEY, JSON.stringify(r.data.user || null));
        $('password').value = '';
        showApp();
        setMsg('Signed in.', 'ok');
      })
      .catch(function (err) { setMsg('Network error: ' + err.message, 'err'); });
  });

  $('createForm').addEventListener('submit', function (e) {
    e.preventDefault();
    clearMsg();
    var orderId = $('orderId').value;
    if (!orderId) { setMsg('Select an order before creating a trip.', 'err'); return; }
    var body = { orderId: orderId };
    var driverId = $('driverId').value;
    var truckId = $('truckId').value;
    var rate = $('rateEur').value.trim();
    if (driverId) body.driverId = driverId;
    if (truckId) body.truckId = truckId;
    if (rate !== '') body.rateEur = Number(rate);
    api('/api/trips', { method: 'POST', token: token(), body: body }).then(function (r) {
      if (r.status !== 201) { setMsg(errorText(r.status, r.data), 'err'); return; }
      setMsg('Trip created (' + (r.data.trip && r.data.trip.id) + ').', 'ok');
      $('createForm').reset();
      $('orderId').value = '';
      loadTrips();
    }).catch(function (err) { setMsg('Network error: ' + err.message, 'err'); });
  });

  $('refresh').addEventListener('click', function () { clearMsg(); loadTrips(); });
  $('drawerClose').addEventListener('click', closeDrawer);
  $('overlay').addEventListener('click', closeDrawer);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDrawer(); });
  $('logout').addEventListener('click', function (e) {
    e.preventDefault();
    sessionStorage.removeItem(TOKEN_KEY);
    sessionStorage.removeItem(USER_KEY);
    clearMsg();
    showLogin();
  });

  if (token()) showApp(); else showLogin();
})();
</script>
</body>
</html>
