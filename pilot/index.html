<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="index.title"></title>
<style>
  :root{
    --navy-950: oklch(0.20 0.04 258);
    --bg: oklch(0.985 0.003 250);
    --surface: oklch(1 0 0);
    --ink: oklch(0.24 0.05 258);
    --muted: oklch(0.48 0.02 255);
    --border: oklch(0.90 0.006 255);
    --accent: oklch(0.80 0.165 82);
    --accent-deep: oklch(0.47 0.130 62);
    --on-accent: oklch(0.20 0.040 258);
    --on-dark: oklch(0.985 0.002 250);
    --font-display: "Barlow Condensed", "Arial Narrow", sans-serif;
    --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --shadow-card: 0 1px 2px oklch(0.2 0.04 258 / .05), 0 10px 30px oklch(0.2 0.04 258 / .06);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5}
  header.top{background:var(--navy-950);color:var(--on-dark);padding:16px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header.top .brand{font-family:var(--font-display);font-weight:600;font-size:20px;letter-spacing:.02em;text-transform:uppercase}
  header.top .tag{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
  header.top .spacer{flex:1}
  header.top .lang-slot{display:flex;align-items:center;gap:8px;font-size:12px}
  header.top label.lang{display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.08em;color:var(--on-dark);opacity:.85}
  header.top select.lang-switcher{font-family:inherit;font-size:13px;padding:5px 7px;border-radius:6px;border:1px solid var(--navy-950);
    background:var(--on-dark);color:var(--ink)}
  main{max-width:760px;margin:0 auto;padding:40px 20px 60px}
  h1{font-family:var(--font-display);font-weight:600;font-size:34px;letter-spacing:.01em;margin:0 0 8px}
  p.lead{color:var(--muted);margin:0 0 28px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
  a.card{display:block;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-card);padding:20px;text-decoration:none;color:var(--ink);transition:transform .15s ease}
  a.card:hover{transform:translateY(-2px)}
  a.card h2{font-family:var(--font-display);font-weight:600;font-size:20px;margin:0 0 6px;letter-spacing:.01em}
  a.card p{margin:0;color:var(--muted);font-size:13px}
  a.card .go{display:inline-block;margin-top:14px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-deep)}
  footer{margin-top:34px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header class="top">
  <span class="brand" data-i18n="brand.name"></span>
  <span class="tag" data-i18n="common.pilotTag"></span>
  <span class="spacer"></span>
  <span class="lang-slot" id="langSlot"></span>
</header>
<main>
  <h1 data-i18n="index.h1"></h1>
  <p class="lead" data-i18n="index.lead"></p>
  <div class="grid">
    <a class="card" href="dashboard.html">
      <h2 data-i18n="nav.dashboard"></h2>
      <p data-i18n="index.dashboardCard"></p>
      <span class="go" data-i18n="index.openDashboard"></span>
    </a>
    <a class="card" href="driver.html">
      <h2 data-i18n="nav.driver"></h2>
      <p data-i18n="index.driverCard"></p>
      <span class="go" data-i18n="index.openDriver"></span>
    </a>
  </div>
  <footer data-i18n="index.footer"></footer>
</main>

<script src="lib/i18n.js"></script>
<script src="lib/i18n-ui.js"></script>
<script>
(function () {
  'use strict';
  // Board task #6: the landing page has no session, so the locale comes from
  // ?lang=, the browser's remembered choice, or its own language — then EN.
  window.RoadwiseI18nUI.init({ mount: '#langSlot' });
})();
</script>
</body>
</html>
