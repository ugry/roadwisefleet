<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoadwiseFleet — Pilot Driver</title>
<style>
  :root{
    --navy-950: oklch(0.20 0.04 258);
    --bg: oklch(0.985 0.003 250);
    --surface: oklch(1 0 0);
    --ink: oklch(0.24 0.05 258);
    --muted: oklch(0.48 0.02 255);
    --border: oklch(0.90 0.006 255);
    --accent: oklch(0.80 0.165 82);
    --accent-deep: oklch(0.47 0.130 62);
    --on-accent: oklch(0.20 0.040 258);
    --on-dark: oklch(0.985 0.002 250);
    --success: oklch(0.56 0.130 158);
    --danger: oklch(0.55 0.190 26);
    --font-display: "Barlow Condensed", "Arial Narrow", sans-serif;
    --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --shadow-card: 0 1px 2px oklch(0.2 0.04 258 / .05), 0 10px 30px oklch(0.2 0.04 258 / .06);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45}
  a{color:var(--accent-deep)}
  header.top{background:var(--navy-950);color:var(--on-dark);padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header.top .brand{font-family:var(--font-display);font-weight:600;font-size:20px;letter-spacing:.02em;text-transform:uppercase}
  header.top .tag{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
  header.top .spacer{flex:1}
  header.top nav a{color:var(--on-dark);opacity:.85;margin-left:14px;text-decoration:none;font-size:13px}
  header.top nav a:hover{opacity:1;text-decoration:underline}
  main{max-width:820px;margin:0 auto;padding:26px 20px 60px}
  h1{font-family:var(--font-display);font-weight:600;font-size:28px;letter-spacing:.01em;margin:0 0 4px}
  .muted{color:var(--muted);font-size:13px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-card);padding:18px;margin:18px 0}
  .card h2{font-family:var(--font-display);font-weight:600;font-size:18px;margin:0 0 12px;letter-spacing:.01em}
  label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:10px 0 4px}
  input{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:7px;font-family:inherit;font-size:14px;background:var(--surface);color:var(--ink)}
  input:focus{outline:none;box-shadow:0 0 0 3px oklch(0.80 0.165 82 / .55);border-color:var(--accent)}
  button{font-family:inherit;font-size:14px;font-weight:600;border:1px solid transparent;border-radius:7px;padding:9px 14px;cursor:pointer}
  button.primary{background:var(--accent);color:var(--on-accent)}
  button.primary:hover{filter:brightness(1.05)}
  button.ghost{background:transparent;border-color:var(--border);color:var(--ink)}
  button.small{padding:5px 9px;font-size:12px}
  button:disabled{opacity:.5;cursor:default}
  .trip{border:1px solid var(--border);border-radius:9px;padding:14px;margin:10px 0;background:var(--surface)}
  .trip .route{font-family:var(--font-display);font-weight:600;font-size:18px;letter-spacing:.01em}
  .trip .meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px;font-size:13px;color:var(--muted)}
  .status{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.04em;background:var(--bg);border:1px solid var(--border);color:var(--ink);text-transform:uppercase}
  .status.s-DELIVERED,.status.s-POD_UPLOADED,.status.s-INVOICED,.status.s-SETTLED{color:var(--success);border-color:var(--success)}
  .status.s-CANCELLED{color:var(--danger);border-color:var(--danger)}
  .status.s-VERIFIED{color:var(--success);border-color:var(--success)}
  .status.s-REJECTED{color:var(--danger);border-color:var(--danger)}
  .status.s-UPLOADED{color:var(--accent-deep);border-color:var(--accent-deep)}
  .status.s-IN_TRANSIT,.status.s-LOADED{color:var(--accent-deep);border-color:var(--accent-deep)}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .docs{margin-top:14px;border-top:1px solid var(--border);padding-top:12px}
  .docs .section-title{font-family:var(--font-display);font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
  .doclist table{width:100%;border-collapse:collapse;font-size:13px}
  .doclist th,.doclist td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--border)}
  .doclist th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
  .upload{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
  .upload select{padding:9px 10px;border:1px solid var(--border);border-radius:7px;font-family:inherit;font-size:14px;background:var(--surface);color:var(--ink)}
  .upload input[type=file]{font-size:13px;max-width:230px}
  .upload .hint{font-size:12px;color:var(--muted);width:100%}
  .msg{padding:10px 12px;border-radius:7px;margin:12px 0;font-size:13px;display:none;white-space:pre-wrap}
  .msg.show{display:block}
  .msg.err{background:oklch(0.55 0.19 26 / .08);border:1px solid var(--danger);color:var(--danger)}
  .msg.ok{background:oklch(0.56 0.13 158 / .10);border:1px solid var(--success);color:oklch(0.40 0.12 158)}
  .hidden{display:none !important}
  .who{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<header class="top">
  <span class="brand">RoadwiseFleet</span>
  <span class="tag">Pilot · Driver</span>
  <span class="spacer"></span>
  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="index.html">Pilot home</a>
  </nav>
</header>
<main>
  <h1>My trips</h1>
  <p class="muted">Live trip state for the signed-in driver.</p>

  <div id="globalMsg" class="msg"></div>

  <section id="loginCard" class="card">
    <h2>Driver sign in</h2>
    <form id="loginForm" autocomplete="on">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="username" placeholder="driver1@pilot.roadwisefleet.test">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required autocomplete="current-password">
      <div style="margin-top:14px"><button class="primary" type="submit">Sign in</button></div>
    </form>
  </section>

  <section id="app" class="hidden">
    <p class="who">Signed in as <strong id="whoName">—</strong> · <a href="#" id="logout">Sign out</a> · <button class="ghost small" id="refresh" type="button">Refresh</button></p>
    <div id="tripList"><p class="muted">Loading…</p></div>
  </section>
</main>

<script>
(function () {
  'use strict';
  var TOKEN_KEY = 'rwf_token';
  var USER_KEY = 'rwf_user';
  // Mirror of apps/api/src/trip-status.js — UI convenience only; the API is authoritative.
  var TRANSITIONS = {
    DRAFT: ['ASSIGNED', 'CANCELLED'],
    ASSIGNED: ['LOADED', 'CANCELLED'],
    LOADED: ['IN_TRANSIT'],
    IN_TRANSIT: ['DELIVERED'],
    DELIVERED: ['POD_UPLOADED'],
    POD_UPLOADED: ['INVOICED'],
    INVOICED: ['SETTLED'],
    SETTLED: [],
    CANCELLED: []
  };

  // Document upload (board task #3). The API is authoritative on type, size and
  // role; these are only so the driver gets an early, friendly message.
  var MAX_UPLOAD_BYTES = 10 * 1024 * 1024; // mirrors the API default (MAX_UPLOAD_BYTES)
  var DOC_TYPES = [
    ['pod', 'POD'],
    ['ecmr', 'eCMR'],
    ['e_irsaliye', 'e-İrsaliye'],
    ['invoice', 'Invoice'],
    ['driver_license', 'Driving licence'],
    ['cpc', 'Driver CPC'],
    ['medical', 'Medical certificate'],
    ['insurance', 'Insurance'],
    ['tacho_file', 'Tachograph file']
  ];
  var DOC_OPTIONS = DOC_TYPES.map(function (d) {
    return '<option value="' + esc(d[0]) + '">' + esc(d[1]) + '</option>';
  }).join('');

  function $(id) { return document.getElementById(id); }
  function token() { return sessionStorage.getItem(TOKEN_KEY) || ''; }
  function setMsg(text, kind) {
    var el = $('globalMsg');
    el.className = 'msg show ' + (kind || 'err');
    el.textContent = text;
  }
  function clearMsg() { var el = $('globalMsg'); el.className = 'msg'; el.textContent = ''; }

  function errorText(status, data) {
    if (status === 401) return 'Not authorised (401): please sign in again.';
    if (status === 403) return 'Forbidden (403): this trip is not assigned to you.';
    var code = (data && data.error) || ('http_' + status);
    if (code === 'invalid_transition') return 'Rejected transition (400): ' + data.from + ' -> ' + data.to + '.';
    if (code === 'invalid_status') return 'Unknown status (400).';
    if (code === 'pod_required') return 'Upload a POD or eCMR document before marking the trip POD_UPLOADED.';
    if (code === 'unsupported_type') return 'Unsupported file type (400). Use a JPEG, PNG, WebP, HEIC or PDF.';
    if (code === 'file_too_large') return 'File too large (400). The maximum is 10 MiB.';
    if (code === 'invalid_size') return 'The file is empty (400).';
    if (code === 'invalid_doc_type') return 'Unknown document type (400).';
    if (code === 'invalid_upload') return 'The upload payload was rejected (400).';
    if (code === 'invalid_filename') return 'The filename was rejected (400).';
    return code + ' (' + status + ')';
  }

  function api(path, opts) {
    opts = opts || {};
    var headers = {};
    if (opts.body) headers['content-type'] = 'application/json';
    if (opts.token) headers['authorization'] = 'Bearer ' + opts.token;
    return fetch(path, {
      method: opts.method || 'GET',
      headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function (res) {
      return res.json().catch(function () { return null; }).then(function (data) {
        return { status: res.status, data: data };
      });
    });
  }

  function money(v) {
    if (v === null || v === undefined || v === '') return '—';
    var n = Number(v);
    return Number.isFinite(n) ? '€' + n.toFixed(2) : '—';
  }

  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function showApp() {
    var user = null;
    try { user = JSON.parse(sessionStorage.getItem(USER_KEY) || 'null'); } catch (e) { user = null; }
    if (user) $('whoName').textContent = user.name || user.email || 'driver';
    $('loginCard').classList.add('hidden');
    $('app').classList.remove('hidden');
    loadTrips();
  }

  function showLogin() {
    $('app').classList.add('hidden');
    $('loginCard').classList.remove('hidden');
  }

  function loadTrips() {
    return api('/api/driver/trips', { token: token() }).then(function (r) {
      if (r.status === 401) { sessionStorage.removeItem(TOKEN_KEY); sessionStorage.removeItem(USER_KEY); showLogin(); setMsg(errorText(r.status, r.data), 'err'); return; }
      if (r.status !== 200) { setMsg(errorText(r.status, r.data), 'err'); return; }
      renderTrips(r.data && r.data.trips ? r.data.trips : []);
    });
  }

  function renderTrips(trips) {
    var list = $('tripList');
    if (!trips.length) { list.innerHTML = '<p class="muted">No trips assigned to you.</p>'; return; }
    list.innerHTML = trips.map(function (t) {
      var order = t.order || {};
      var next = TRANSITIONS[t.status] || [];
      var buttons = next.map(function (s) {
        return '<button class="primary small" data-trip="' + esc(t.id) + '" data-to="' + esc(s) + '">Mark ' + esc(s) + '</button>';
      }).join('');
      var last = Array.isArray(t.statusEvents) && t.statusEvents.length
        ? t.statusEvents[t.statusEvents.length - 1]
        : null;
      var updated = last && last.happenedAt ? new Date(last.happenedAt).toLocaleString() : '—';
      return '<div class="trip" data-trip-card="' + esc(t.id) + '">' +
        '<div class="route">' + esc(order.origin || '?') + ' → ' + esc(order.destination || '?') + '</div>' +
        '<div class="meta">' +
          '<span><span class="status s-' + esc(t.status) + '">' + esc(t.status) + '</span></span>' +
          '<span>Rate: ' + money(t.rateEur) + '</span>' +
          '<span>Last update: ' + esc(updated) + '</span>' +
        '</div>' +
        '<div class="actions">' + (buttons || '<span class="muted">No further transitions.</span>') + '</div>' +
        '<div class="docs">' +
          '<div class="section-title">Documents</div>' +
          '<div class="doclist" data-docs="' + esc(t.id) + '"><p class="muted">Loading…</p></div>' +
          '<div class="upload">' +
            '<select data-doctype="' + esc(t.id) + '" aria-label="Document type">' + DOC_OPTIONS + '</select>' +
            '<input type="file" data-file="' + esc(t.id) + '" accept="image/jpeg,image/png,image/webp,image/heic,image/heif,application/pdf" aria-label="Document file">' +
            '<button class="primary small" data-upload="' + esc(t.id) + '" type="button">Upload</button>' +
            '<span class="hint">A POD or eCMR is required before POD_UPLOADED · JPEG/PNG/WebP/HEIC/PDF · max 10 MiB</span>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');
    Array.prototype.forEach.call(list.querySelectorAll('button[data-trip]'), function (btn) {
      btn.addEventListener('click', function () {
        transition(btn.getAttribute('data-trip'), btn.getAttribute('data-to'), btn);
      });
    });
    Array.prototype.forEach.call(list.querySelectorAll('button[data-upload]'), function (btn) {
      btn.addEventListener('click', function () { uploadDocument(btn.getAttribute('data-upload'), btn); });
    });
    trips.forEach(function (t) { loadDocs(t.id); });
  }

  // Attribute lookup by value — never interpolate an id into a CSS selector.
  function byData(attr, value) {
    var nodes = document.querySelectorAll('[' + attr + ']');
    for (var i = 0; i < nodes.length; i++) {
      if (nodes[i].getAttribute(attr) === value) return nodes[i];
    }
    return null;
  }

  function loadDocs(id) {
    return api('/api/trips/' + encodeURIComponent(id) + '/documents', { token: token() }).then(function (r) {
      var host = byData('data-docs', id);
      if (!host) return;
      if (r.status !== 200) { host.innerHTML = '<p class="muted">' + esc(errorText(r.status, r.data)) + '</p>'; return; }
      renderDocs(host, (r.data && r.data.documents) || []);
    }).catch(function (err) {
      var host = byData('data-docs', id);
      if (host) host.innerHTML = '<p class="muted">' + esc(err.message) + '</p>';
    });
  }

  function renderDocs(host, docs) {
    if (!docs.length) { host.innerHTML = '<p class="muted">No documents uploaded yet.</p>'; return; }
    host.innerHTML = '<table><thead><tr><th>Type</th><th>Status</th><th>Uploaded</th></tr></thead><tbody>' +
      docs.map(function (d) {
        return '<tr><td>' + esc(d.docType) + '</td>' +
          '<td><span class="status s-' + esc(d.status) + '">' + esc(d.status) + '</span></td>' +
          '<td>' + esc(d.uploadedAt ? new Date(d.uploadedAt).toLocaleString() : '—') + '</td></tr>';
      }).join('') + '</tbody></table>';
  }

  function readBase64(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error('could not read the file')); };
      reader.onload = function () {
        var url = String(reader.result || '');
        var comma = url.indexOf(',');
        resolve(comma >= 0 ? url.slice(comma + 1) : '');
      };
      reader.readAsDataURL(file);
    });
  }

  // Upload one document (board task #3): the file is read as base64 and POSTed
  // as JSON, so the pilot needs no multipart dependency. The API enforces the
  // doc type, the size cap and the role; the checks here are only for UX.
  function uploadDocument(id, btn) {
    clearMsg();
    var card = byData('data-trip-card', id);
    var sel = card ? card.querySelector('select[data-doctype]') : null;
    var input = card ? card.querySelector('input[data-file]') : null;
    var file = input && input.files ? input.files[0] : null;
    if (!file) { setMsg('Choose a file to upload first.', 'err'); return; }
    if (file.size <= 0) { setMsg('That file is empty.', 'err'); return; }
    if (file.size > MAX_UPLOAD_BYTES) { setMsg('That file is larger than 10 MiB.', 'err'); return; }
    btn.disabled = true;
    readBase64(file).then(function (b64) {
      return api('/api/trips/' + encodeURIComponent(id) + '/documents', {
        method: 'POST',
        token: token(),
        body: {
          docType: sel ? sel.value : 'pod',
          filename: file.name,
          mimeType: file.type || '',
          dataBase64: b64
        }
      });
    }).then(function (r) {
      if (r.status !== 201) { setMsg(errorText(r.status, r.data), 'err'); return loadDocs(id); }
      setMsg('Uploaded ' + (sel ? sel.value : 'document') + ' for trip ' + id + '.', 'ok');
      if (input) input.value = '';
      return loadDocs(id);
    }).catch(function (err) { setMsg('Network error: ' + err.message, 'err'); })
      .then(function () { btn.disabled = false; });
  }

  function transition(id, to, btn) {
    clearMsg();
    btn.disabled = true;
    api('/api/trips/' + encodeURIComponent(id) + '/status', { method: 'POST', token: token(), body: { status: to } })
      .then(function (r) {
        if (r.status !== 200) { setMsg(errorText(r.status, r.data), 'err'); return loadTrips(); }
        setMsg('Trip updated: ' + to + '.', 'ok');
        return loadTrips();
      })
      .catch(function (err) { setMsg('Network error: ' + err.message, 'err'); })
      .then(function () { btn.disabled = false; });
  }

  $('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    clearMsg();
    api('/api/auth/login', { method: 'POST', body: { email: $('email').value.trim(), password: $('password').value } })
      .then(function (r) {
        if (r.status !== 200) { setMsg(errorText(r.status, r.data), 'err'); return; }
        sessionStorage.setItem(TOKEN_KEY, r.data.token);
        sessionStorage.setItem(USER_KEY, JSON.stringify(r.data.user || null));
        $('password').value = '';
        showApp();
        setMsg('Signed in.', 'ok');
      })
      .catch(function (err) { setMsg('Network error: ' + err.message, 'err'); });
  });

  $('refresh').addEventListener('click', function () { clearMsg(); loadTrips(); });
  $('logout').addEventListener('click', function (e) {
    e.preventDefault();
    sessionStorage.removeItem(TOKEN_KEY);
    sessionStorage.removeItem(USER_KEY);
    clearMsg();
    showLogin();
  });

  if (token()) showApp(); else showLogin();
})();
</script>
</body>
</html>
