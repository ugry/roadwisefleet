# RoadwiseFleet — nginx site config (elilavps2, roadwisefleet.com).
#
# Host path: /etc/nginx/sites-available/roadwisefleet.conf
# Runbook:   infra/pilot-exposure.md
#
# Canonical host: https://roadwisefleet.com (apex). www and http are
# non-canonical and 301 to the apex in a single hop.
#
# Upstream topology (all loopback-only; nothing but nginx is public):
#   /var/www/roadwisefleet        static landing pages            (this host)
#   127.0.0.1:8787                waitlist microservice           (/api/waitlist)
#   127.0.0.1:8080                pilot API + web surfaces         (/pilot/, /app/, /api/)
#
# nginx gotchas this file is written around:
#   * `add_header` inside a location REPLACES every inherited add_header, so the
#     header snippets below are included in each location that needs them.
#   * Several server blocks may listen on the same address:port, but the listen
#     *options* must be identical or nginx fails with "duplicate listen options".
#     That is why `ipv6only=on` (present in the certbot output) is not repeated:
#     both 443 blocks use the plain `listen ... ssl` form.
#   * `# managed by Certbot` lines are regenerated by certbot on renewal — keep
#     them verbatim when editing, and re-sync this mirror after any renewal.
#
# Rate limiting (limit_req): the five lines below are ENABLED as of board #45
# (+ the /app/ line, board #69).
# The zones live in /etc/nginx/conf.d/roadwisefleet-limits.conf, and nginx
# refuses to load a `limit_req zone=...` whose zone is undefined — so that file
# MUST be installed in the same change, before this one. `nginx -t` fails
# closed, so a wrong order refuses the reload instead of breaking the site.
# Install order + verification: infra/pilot-exposure.md §7,
# preflight: infra/checks/nginx-limits-preflight.sh.

# === HTTP (port 80) -> HTTPS apex ==========================================
server {
    listen 80;
    listen [::]:80;
    server_name roadwisefleet.com www.roadwisefleet.com;

    # Both the plain-HTTP and the www forms are non-canonical.
    return 301 https://roadwisefleet.com$request_uri;
}

# === HTTPS www -> apex (301) ===============================================
# The Let's Encrypt certificate is a single SAN cert for both names, so this
# block can terminate TLS for www before redirecting.
server {
    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot

    server_name www.roadwisefleet.com;

    ssl_certificate /etc/letsencrypt/live/roadwisefleet.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/roadwisefleet.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    return 301 https://roadwisefleet.com$request_uri;
}

# === HTTPS apex (canonical) ================================================
server {
    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot

    server_name roadwisefleet.com;

    root /var/www/roadwisefleet;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/roadwisefleet.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/roadwisefleet.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    server_tokens off;
    limit_req_status 429;

    # Security headers for the static landing pages. Must be repeated in every
    # location that serves content from /var/www/roadwisefleet.
    include /etc/nginx/snippets/roadwisefleet-headers-static.conf;

    location = /dashboard {
        alias /var/www/roadwisefleet/dashboard.html;
        include /etc/nginx/snippets/roadwisefleet-headers-static.conf;
    }

    location = /diagrams {
        alias /var/www/roadwisefleet/diagrams.html;
        include /etc/nginx/snippets/roadwisefleet-headers-static.conf;
    }

    # --- legacy waitlist microservice (127.0.0.1:8787) ---------------------
    # Exact match: the service only implements POST/GET /api/waitlist, so
    # nothing else is routed to it. Stays on 8787 until the unification task
    # moves the waitlist onto the pilot API (see infra/pilot-exposure.md §9).
    location = /api/waitlist {
        limit_req zone=rwf_waitlist burst=10 nodelay;   # board #45
        include /etc/nginx/snippets/roadwisefleet-headers-api.conf;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # --- pilot web surface + pilot API (127.0.0.1:8080) --------------------
    # /pilot/ is served by @fastify/static inside the API, so the pages are
    # same-origin with /api/*. noindex is applied here (owned, explicit) and is
    # also present today as an observed header on the live host.
    location /pilot/ {
        limit_req zone=rwf_pilot burst=40 nodelay;      # board #45
        include /etc/nginx/snippets/roadwisefleet-headers-pilot.conf;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # /pilot (no trailing slash) -> /pilot/ ; nginx-side so it does not depend
    # on the upstream's redirect behaviour.
    location = /pilot {
        return 301 https://roadwisefleet.com/pilot/;
    }

    # --- Fleet Manager app (127.0.0.1:8080) --------------------------------
    # Board #69 / GitHub #48: /app/ is served by the API itself
    # (apps/api/src/routes/app.ts + apps/api/src/app-shell.js): an SPA shell
    # plus /app/* static files. There was no /app/ location, so /app/*
    # fell through to the static marketing root and 404'd — the whole Fleet
    # Manager (F1 shell + F2 dashboard and every later function) was
    # unreachable on the public URL. The API route is deployed and healthy
    # (/api/dashboard answers 401/200), so this is a missing proxy block.
    #
    # Its own header snippet, NOT the pilot one: the app declares no inline
    # script/style, so script-src/style-src stay at 'self'. Reusing the pilot
    # snippet's 'unsafe-inline' would needlessly widen the app policy
    # (board #69); infra/checks/app-csp-check.sh enforces this in CI.
    location /app/ {
        limit_req zone=rwf_pilot burst=40 nodelay;      # board #45/#69
        include /etc/nginx/snippets/roadwisefleet-headers-app.conf;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # /app (no trailing slash) -> /app/ ; nginx-side so it does not depend on
    # the upstream's redirect behaviour (the API also 302s to /app/).
    location = /app {
        return 301 https://roadwisefleet.com/app/;
    }

    # --- public customer tracking link (127.0.0.1:8080) --------------------
    # /track/<token> is the shareable, unauthenticated HTML shell
    # (apps/api/src/track-page.js). Without this block the pilot API is
    # loopback-only from the internet, so a shared link is not reachable; the
    # prod vhost proxied only /api/ and /pilot/ until now.
    #
    # The page is self-contained (inline CSS/JS, no CDN, no external font) and
    # fetches same-origin /api/track/<token>, so the pilot HTML header set
    # applies unchanged — including X-Robots-Tag: noindex, nofollow. The API
    # also sets that header at the response level (defence in depth); the
    # include here makes the crawler policy owned configuration, not app
    # behaviour. Rate-limited by the pilot zone (board #45).
    location /track/ {
        limit_req zone=rwf_pilot burst=20 nodelay;      # board #45
        include /etc/nginx/snippets/roadwisefleet-headers-pilot.conf;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # --- pilot API ---------------------------------------------------------
    # Longest-prefix wins, so the exact /api/waitlist block above still routes
    # to 8787; everything else under /api/ goes to the pilot API.
    # The API's /health endpoint is deliberately NOT exposed publicly.
    location /api/ {
        limit_req zone=rwf_api burst=60 nodelay;        # board #45
        include /etc/nginx/snippets/roadwisefleet-headers-api.conf;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
    gzip_min_length 512;
}
