server {
    server_name roadwisefleet.com www.roadwisefleet.com;

    root /var/www/roadwisefleet;
    index index.html;

    location = /dashboard {
        alias /var/www/roadwisefleet/dashboard.html;
    }

    location = /diagrams {
        alias /var/www/roadwisefleet/diagrams.html;
    }

    location /api/waitlist {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 15s;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
    gzip_min_length 512;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/roadwisefleet.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/roadwisefleet.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.roadwisefleet.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = roadwisefleet.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name roadwisefleet.com www.roadwisefleet.com;
    return 404; # managed by Certbot




}