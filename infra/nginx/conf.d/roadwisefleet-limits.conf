# RoadwiseFleet — nginx rate-limit zones (http context only).
#
# Host path: /etc/nginx/conf.d/roadwisefleet-limits.conf
#
# `limit_req_zone` / `limit_conn_zone` are only valid in the http context, so
# they cannot live in sites-available/roadwisefleet.conf. Debian's nginx.conf
# includes /etc/nginx/conf.d/*.conf inside http{}, which is where this file goes.
#
# ORDER MATTERS: this file must be installed BEFORE the site file that uses the
# zones (the `limit_req` lines in sites-available/roadwisefleet.conf are enabled
# as of board #45), otherwise `nginx -t` fails with "unknown limit_req_zone" and
# the reload is refused. Check the pairing first:
#   bash infra/checks/nginx-limits-preflight.sh
#
# Why nginx-side limits when the waitlist service has its own limiter:
# `services/waitlist/server.js` used to key its 5-per-hour limit on
# `req.socket.remoteAddress`, which behind this proxy is always 127.0.0.1 — so
# every visitor shared ONE bucket and real signups could be rejected after five
# submissions an hour. It now keys on the real client (`X-Real-IP`, trusted only
# from a loopback peer — board #45), and nginx keys on $binary_remote_addr as the
# outer layer. Both, deliberately: see infra/pilot-exposure.md §7.

# Waitlist signups: 5/minute per IP, burst 10. Well above human pace, well below
# what a scripted signup flood would need.
limit_req_zone $binary_remote_addr zone=rwf_waitlist:10m rate=5r/m;

# Pilot API: 30 req/s per IP, burst 60 (the dashboard fires a handful of calls
# per interaction; this is only meant to stop abuse).
limit_req_zone $binary_remote_addr zone=rwf_api:10m rate=30r/s;

# Pilot static surface: 20 req/s per IP, burst 40.
limit_req_zone $binary_remote_addr zone=rwf_pilot:10m rate=20r/s;

# Return 429 (Too Many Requests) instead of the default 503.
limit_req_status 429;
