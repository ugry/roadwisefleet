# RoadwiseFleet — security headers for the pilot web surface (/pilot/).
#
# Host path: /etc/nginx/snippets/roadwisefleet-headers-pilot.conf
# Include from the `location /pilot/` block (and repeat in any other location
# that serves pilot HTML — add_header does not inherit through locations).
#
# The pilot pages are stricter than the marketing site: they are entirely
# self-contained, so the policy can be near-lockdown.
#
# Evidence (re-verified 2026-09-24; grep over pilot/ + the CI check
# infra/checks/pilot-csp-check.sh):
#   * No external resources at all: no absolute http(s):// asset URLs, no remote
#     fonts -> 'self' is enough, no third-party host has to be allowed.
#   * SAME-ORIGIN EXTERNAL SCRIPTS are loaded since the i18n change (d3c9ddc):
#     index.html/dashboard.html load lib/i18n.js + lib/i18n-ui.js; driver.html
#     also loads lib/driver-core.js. These are classic <script src> requests, so
#     script-src MUST include 'self'. (The pre-i18n version of this file said
#     "no <script src>" — that was true then, wrong today. Board #65.)
#   * driver.html declares <link rel="manifest" href="manifest.webmanifest">
#     and registers the service worker sw.js (driver.html, `serviceWorker
#     .register('sw.js')`) -> manifest-src and worker-src must allow 'self'.
#     sw.js itself precaches the lib/* files, the manifest and the EN/DE/PL/TR
#     catalogues, all relative/same-origin.
#   * Inline <script> in dashboard.html and driver.html; inline <style> in all
#     three pages -> script-src/style-src 'unsafe-inline' required.
#   * The pages call fetch() on same-origin paths (/api/auth/login, /api/trips)
#     -> connect-src 'self'.
#   * No eval()/new Function()/document.write() in pilot/ (grep: 0).
#
# History: board #7 / PR #13 introduced this snippet with a "self-contained"
# template policy that omitted 'self' — every pilot <script src> was blocked on
# the live surface and the pages never booted (board #65, QA F-surface-1).
#
# X-Robots-Tag: the pilot is a non-indexable preview. The header is present on
# the live host today (observed on /pilot/ and /pilot/*.html); declaring it here
# makes it owned configuration instead of a hand edit.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
add_header X-Robots-Tag "noindex, nofollow" always;
add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; worker-src 'self'; manifest-src 'self'; connect-src 'self'" always;
# Board #65 guard: infra/checks/pilot-csp-check.sh asserts that this policy
# covers every resource the pilot HTML declares (with CSP fallback semantics),
# and asserts the lockdown tokens (default-src 'none', base-uri, form-action,
# frame-ancestors) are NOT relaxed. It runs in CI on every PR.
