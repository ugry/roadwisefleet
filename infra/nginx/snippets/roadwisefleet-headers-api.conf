# RoadwiseFleet — security headers for proxied API responses.
#
# Host path: /etc/nginx/snippets/roadwisefleet-headers-api.conf
# Include from `location = /api/waitlist` and `location /api/`.
#
# These endpoints answer with JSON (or redirects), never HTML, so a strict CSP is
# free: no policy can break a response that is not rendered as a document.
# `frame-ancestors 'none'` is the load-bearing directive here (X-Frame-Options is
# kept for older clients).
#
# No CORS header is added here: the waitlist service emits its own
# `access-control-allow-origin: *` and the pilot API is same-origin only.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
