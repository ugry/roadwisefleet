# RoadwiseFleet — security headers for the static landing pages.
#
# Host path: /etc/nginx/snippets/roadwisefleet-headers-static.conf
# Include from EVERY location that serves /var/www/roadwisefleet: an `add_header`
# inside a location replaces all inherited add_header directives.
#
# Evidence for each CSP source (2026-09-22; live probes + grep over web/):
#   script-src  'self' 'unsafe-inline'
#       All five pages use inline <script> blocks (index.html:2, dashboard.html:1,
#       diagrams.html:1, driver-beacon-screen.html:1, connect-load-posting.html:1).
#       There is no <script src=...> anywhere in web/ (grep: 0 hits), so no
#       external script host has to be allowed.
#   style-src   'self' 'unsafe-inline' https://fonts.googleapis.com
#       Inline <style> blocks plus the Google Fonts stylesheet <link> that every
#       page carries.
#   font-src    https://fonts.gstatic.com
#       Font files fetched by that stylesheet (preconnect target on every page).
#   img-src     'self' data:
#       The favicon is a data: URI SVG; the pages contain 0 <img> elements.
#   connect-src 'self'
#       The waitlist form posts to https://roadwisefleet.com/api/waitlist
#       (same origin).
#   No 'unsafe-eval': grep for eval( / new Function / document.write in web/ is 0.
#
# 'unsafe-inline' for script/style is required today because the pages are
# static files with inline code. Removing it needs per-page nonces/hashes and is
# owned by the app/dev side — see infra/pilot-exposure.md §8.
#
# HSTS: includeSubDomains is safe only while every roadwisefleet.com subdomain is
# HTTPS-only (today: apex + www only, same cert). `preload` is deliberately NOT
# set — that is a hard-to-reverse, policy-level decision.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline'; connect-src 'self'; upgrade-insecure-requests" always;
