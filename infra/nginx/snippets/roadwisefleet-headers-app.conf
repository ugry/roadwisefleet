# RoadwiseFleet — security headers for the Fleet Manager app (/app/).
#
# Host path: /etc/nginx/snippets/roadwisefleet-headers-app.conf
# Include from the `location /app/` block (and repeat in any other location
# that serves app HTML — add_header does not inherit through locations).
#
# Board #69 / GitHub #48: /app/ is served by the API itself
# (apps/api/src/routes/app.ts + apps/api/src/app-shell.js) — an SPA shell plus
# /app/* static files. This snippet is deliberately NOT the pilot snippet: the
# app pages declare no inline <script>/<style> and load only same-origin files,
# so the policy can be stricter than /pilot/'s and must not reuse its
# 'unsafe-inline' tokens.
#
# Evidence (grep over app/ + infra/checks/app-csp-check.sh, which runs in CI):
#   * app/index.html loads /app/app.css, /pilot/lib/i18n.js, /pilot/lib/i18n-ui.js,
#     /app/lib/*.js and /app/app.js — all same-origin <script src> requests, so
#     script-src MUST include 'self'. A policy that omits it is the board #65 /
#     #39 failure mode: the app shell never boots.
#   * there is NO inline <script> and NO inline <style> in app/ (grep: 0), no
#     `style="..."` attribute and no `.style.` assignment — so script-src/style-src
#     do NOT need 'unsafe-inline'. app-csp-check.sh FAILS if 'unsafe-inline' is
#     added to script-src/style-src while the app still declares no inline code
#     ("do not reuse the pilot snippet" — board #69).
#   * the app calls fetch() on same-origin /api/* paths -> connect-src 'self'.
#   * no external hosts, no manifest, no service worker, no @font-face.
#
# X-Robots-Tag: the Fleet Manager is an authenticated internal app; the API route
# already sets x-robots-tag on every response. Declaring it here makes the
# crawler policy owned configuration (defence in depth), as for /pilot/.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
add_header X-Robots-Tag "noindex, nofollow" always;
add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'" always;
# Board #69 guard: infra/checks/app-csp-check.sh asserts this policy covers every
# resource the app HTML/JS declares AND that script-src/style-src stay at 'self'
# (no 'unsafe-inline') while the app declares no inline code. It runs in CI
# (job `app-csp-check`) on every PR and push.
