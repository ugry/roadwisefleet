# RoadwiseFleet — security headers for the strict, no-inline-code surfaces
# (/app/, /c/, /s/).
#
# Host path: /etc/nginx/snippets/roadwisefleet-headers-app.conf
# Include from every location that serves one of those HTML surfaces
# (`add_header` does not inherit through locations).
#
# Board #69 / GitHub #48: /app/ is served by the API itself
# (apps/api/src/routes/app.ts + apps/api/src/app-shell.js) — an SPA shell plus
# /app/* static files. Board #87 added /c/ (customer portal) and /s/ (solo
# driver), which the site config deliberately points at THIS snippet too: all
# three declare no inline <script>/<style> and load only same-origin files, so
# the policy can be stricter than /pilot/'s and must not reuse its
# 'unsafe-inline' tokens.
#
# Evidence (grep over app/, customer/, solo/ + infra/checks/app-csp-check.sh,
# which runs in CI for each of those surfaces):
#   * app/index.html loads /app/app.css, /pilot/lib/i18n.js, /pilot/lib/i18n-ui.js,
#     /app/lib/*.js and /app/app.js — all same-origin <script src> requests, so
#     script-src MUST include 'self'. A policy that omits it is the board #65 /
#     #39 failure mode: the app shell never boots.
#   * there is NO inline <script> and NO inline <style> in app/ (grep: 0), no
#     `style="..."` attribute and no `.style.` assignment — so script-src/style-src
#     do NOT need 'unsafe-inline'. app-csp-check.sh FAILS if 'unsafe-inline' is
#     added to script-src/style-src while a surface still declares no inline code
#     ("do not reuse the pilot snippet" — board #69).
#   * the app calls fetch() on same-origin /api/* paths -> connect-src 'self'.
#   * no external hosts, no @font-face.
#   * **manifest-src** (board #91): solo/index.html declares
#     `<link rel="manifest" href="/s/manifest.webmanifest">`, and `solo/`
#     registers NO service worker (grep: no `serviceWorker` / `register(`), so
#     `manifest-src 'self'` is required and `worker-src` is not. Without the
#     directive the fetch falls back to `default-src 'none'` and the browser
#     blocks the solo PWA manifest. app/ and customer/ declare no manifest, so
#     the directive is a no-op there; app-csp-check.sh fails if a surface DOES
#     declare one and the policy does not allow it (both directions covered).
#
# X-Robots-Tag: the Fleet Manager is an authenticated internal app; the API route
# already sets x-robots-tag on every response. Declaring it here makes the
# crawler policy owned configuration (defence in depth), as for /pilot/.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
add_header X-Robots-Tag "noindex, nofollow" always;
add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; style-src 'self'; script-src 'self'; manifest-src 'self'; connect-src 'self'" always;
# Board #69 guard: infra/checks/app-csp-check.sh asserts this policy covers every
# resource the HTML/JS of each surface declares (incl. a declared manifest, board
# #91) AND that script-src/style-src stay at 'self' (no 'unsafe-inline') while
# those surfaces declare no inline code. It runs in CI (job `app-csp-check`) on
# every PR and push, once per surface (app/, customer/, solo/).
