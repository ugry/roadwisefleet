# RoadwiseFleet — STAGING vhost (elilavps2).
#
# Host path: /etc/nginx/sites-available/roadwisefleet-staging.conf
# Runbook:   infra/deploy.md  (board task eila/tasks#31, scope item 2)
#
# READY-TO-APPLY ARTIFACT — not installed. Installing it is a production change
# (DNS + cert + nginx reload) that needs owner approval and a change window.
#
# Purpose: a staging surface for the pilot that is separate from the surface the
# owner tests (apex /pilot/). It proxies the whole staging app
# (127.0.0.1:8081: /pilot/, /api/, /track/) and is gated by HTTP basic auth so it
# is not a second public surface. The apex vhost is untouched.
#
# Owner prerequisites (one-off, done by the owner/orchestrator, not DevOps):
#   1. DNS: A record staging.roadwisefleet.com -> 51.222.139.227
#   2. Password file (value never in this repo):
#        sudo apt-get install -y apache2-utils
#        sudo htpasswd -c /etc/nginx/roadwisefleet-staging.htpasswd <user>
#        sudo chown root:www-data /etc/nginx/roadwisefleet-staging.htpasswd
#        sudo chmod 0640 /etc/nginx/roadwisefleet-staging.htpasswd
#   3. Certificate:
#        sudo certbot --nginx -d staging.roadwisefleet.com
#      (certbot rewrites this file — keep the `managed by Certbot` lines, then
#       sync the result back into this repo, as with the apex vhost.)
#   4. UFW already allows 80/443; no change needed.
#
# Path-only fallback (if a separate hostname is not wanted): add
#   location /staging/ { auth_basic ...; proxy_pass http://127.0.0.1:8081/; }
# to the apex vhost. It needs a rewrite because the app serves /pilot/ and /api/
# at the root; documented in infra/deploy.md §4 as the less-preferred option.
#
# nginx gotchas this file is written around (same as the apex vhost):
#   * `add_header` in a location REPLACES inherited headers -> the header
#     snippet is included in every location that returns content.
#   * Do not repeat `ipv6only=on`; both 443 blocks must use identical listen
#     options or nginx fails with "duplicate listen options".

# === HTTP -> HTTPS =========================================================
server {
    listen 80;
    listen [::]:80;
    server_name staging.roadwisefleet.com;

    return 301 https://staging.roadwisefleet.com$request_uri;
}

# === HTTPS staging (basic auth, noindex) ===================================
server {
    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot

    server_name staging.roadwisefleet.com;

    ssl_certificate /etc/letsencrypt/live/staging.roadwisefleet.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/staging.roadwisefleet.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    server_tokens off;

    # Staging is for the owner's acceptance test: keep it out of search engines
    # and make sure nobody can reach it without the shared password.
    auth_basic "RoadwiseFleet staging";
    auth_basic_user_file /etc/nginx/roadwisefleet-staging.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 12m;

    # Everything (pages, API, tracking links) is served by the staging API unit.
    location / {
        include /etc/nginx/snippets/roadwisefleet-headers-pilot.conf;

        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # /health is loopback-only on purpose, exactly as in production: it is not
    # proxied here, and it is behind basic auth in any case.
}
