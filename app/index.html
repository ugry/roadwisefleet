<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title data-i18n="app.title">Fleet Manager — RoadwiseFleet</title>
<link rel="stylesheet" href="/app/app.css">
</head>
<body>
<a class="skip-link" href="#outlet" data-i18n="app.skipToContent">Skip to content</a>

<!-- =====================================================================
     Login view. Unauthenticated. Shown by app.js whenever there is no
     usable session; the app view is never rendered in that state.
     ===================================================================== -->
<section id="loginView" class="login" hidden>
  <div class="login-card">
    <p class="brand-line">
      <span class="brand" data-i18n="brand.name">RoadwiseFleet</span>
      <span class="tag" data-i18n="brand.appTag">Fleet Manager</span>
    </p>
    <h1 data-i18n="login.title">Sign in to Fleet Manager</h1>
    <p class="lead" data-i18n="login.lead"></p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email" data-i18n="login.email">Email</label>
        <input id="email" name="email" type="email" required autocomplete="username"
               inputmode="email" spellcheck="false" autofocus
               data-i18n-placeholder="login.emailPlaceholder"
               aria-describedby="loginHelper">
      </div>
      <div class="field">
        <label for="password" data-i18n="login.password">Password</label>
        <input id="password" name="password" type="password" required
               autocomplete="current-password"
               data-i18n-placeholder="login.passwordPlaceholder">
      </div>
      <p class="helper" id="loginHelper" data-i18n="login.helper"></p>
      <p class="alert" id="loginError" role="alert" hidden></p>
      <button class="primary" id="loginSubmit" type="submit" data-i18n="login.submit">Sign in</button>
    </form>
    <a class="secondary" id="loginToSignup" href="/app/signup" data-i18n="login.createAccount">Register</a>
  </div>
</section>

<!-- =====================================================================
     Signup view. Public (board task #86): a visitor registers a fleet and
     is signed in immediately. Never reachable while signed in — the guard
     sends a signed-in person to their role home.
     ===================================================================== -->
<section id="signupView" class="login" hidden>
  <div class="login-card">
    <p class="brand-line">
      <span class="brand" data-i18n="brand.name">RoadwiseFleet</span>
      <span class="tag" data-i18n="brand.appTag">Fleet Manager</span>
    </p>
    <h1 data-i18n="signup.title">Create your account</h1>
    <p class="lead" data-i18n="signup.lead"></p>

    <form id="signupForm" novalidate>
      <fieldset class="field" id="signupAccountType" tabindex="-1">
        <legend data-i18n="signup.accountType">Account type</legend>
        <label class="choice">
          <input type="radio" name="accountType" value="customer">
          <span data-i18n="account.type.customer">Customer</span>
          <small data-i18n="account.type.customerHint"></small>
        </label>
        <label class="choice">
          <input type="radio" name="accountType" value="fleet" checked>
          <span data-i18n="account.type.fleet">Fleet</span>
          <small data-i18n="account.type.fleetHint"></small>
        </label>
        <label class="choice">
          <input type="radio" name="accountType" value="solo_driver">
          <span data-i18n="account.type.soloDriver">Solo truck driver</span>
          <small data-i18n="account.type.soloDriverHint"></small>
        </label>
      </fieldset>
      <div class="field">
        <label for="signupName" data-i18n="signup.name">Your name</label>
        <input id="signupName" name="name" type="text" required autocomplete="name"
               data-i18n-placeholder="signup.namePlaceholder">
      </div>
      <div class="field">
        <label for="signupCompany" data-i18n="signup.company">Company (optional)</label>
        <input id="signupCompany" name="company" type="text" autocomplete="organization"
               data-i18n-placeholder="signup.companyPlaceholder">
      </div>
      <div class="field">
        <label for="signupEmail" data-i18n="signup.email">Work email</label>
        <input id="signupEmail" name="email" type="email" required autocomplete="username"
               inputmode="email" spellcheck="false"
               data-i18n-placeholder="signup.emailPlaceholder"
               aria-describedby="signupHelper">
      </div>
      <div class="field">
        <label for="signupPassword" data-i18n="signup.password">Password</label>
        <input id="signupPassword" name="password" type="password" required
               autocomplete="new-password"
               data-i18n-placeholder="signup.passwordPlaceholder"
               aria-describedby="signupHelper">
      </div>
      <p class="helper" id="signupHelper" data-i18n="signup.passwordHint"></p>
      <p class="alert" id="signupError" role="alert" hidden></p>
      <button class="primary" id="signupSubmit" type="submit" data-i18n="signup.submit">Register</button>
    </form>
    <p class="helper"><a id="signupToLogin" href="/app/login" data-i18n="signup.haveAccount"></a></p>
  </div>
</section>

<!-- =====================================================================
     App view. Authenticated shell: header, role-aware navigation, and the
     outlet every later function (F2–F10) mounts into.
     ===================================================================== -->
<div id="appView" class="app" hidden>
  <header class="topbar">
    <p class="brand-line">
      <span class="brand" data-i18n="brand.name">RoadwiseFleet</span>
      <span class="tag" data-i18n="brand.appTag">Fleet Manager</span>
    </p>
    <p class="who">
      <span data-i18n="common.signedInAs">Signed in as</span>
      <strong id="whoName"></strong>
      <span class="role-badge" id="whoRole"></span>
    </p>
    <span class="spacer"></span>
    <span class="lang-slot" id="langSlot"></span>
    <button class="ghost" id="logout" type="button" data-i18n="common.signOut">Sign out</button>
  </header>

  <div class="layout">
    <nav class="sidenav" id="navSlot" aria-label="Main navigation" data-i18n-aria-label="common.menu"></nav>
    <main class="content">
      <p class="alert" id="globalError" role="alert" hidden></p>
      <section id="outlet" tabindex="-1" aria-live="polite"></section>
    </main>
  </div>
</div>

<noscript>
  <p class="noscript">Fleet Manager needs JavaScript. Enable it and reload the page.</p>
</noscript>

<!-- Shared i18n core and DOM layer, reused from the pilot (board task #6). -->
<script src="/pilot/lib/i18n.js"></script>
<script src="/pilot/lib/i18n-ui.js"></script>
<!-- The shared driver core owns the document checklist / POD-gate rules
     (board task #4); the documents UI reuses it instead of restating them. -->
<script src="/pilot/lib/driver-core.js"></script>
<script src="/app/lib/app-core.js"></script>
<!-- The account-type catalogue (board task #111), shared with the API so the
     three-way signup choice and the server agree by construction. -->
<script src="/app/lib/account-types.js"></script>
<!-- The signup rules (board task #86), shared with the API endpoint so the form
     and the server agree by construction. -->
<script src="/app/lib/signup.js"></script>
<script src="/app/lib/trips.js"></script>
<script src="/app/lib/documents.js"></script>
<!-- The driver client view model (board task #38, F7a); it injects the shared
     driver core and the document rules rather than restating them. -->
<script src="/app/lib/driver.js"></script>
<script src="/app/lib/tracking.js"></script>
<script src="/app/lib/dispatch.js"></script>
<script src="/app/lib/dashboard.js"></script>
<script src="/app/lib/assign.js"></script>
<script src="/app/app.js"></script>
</body>
</html>
