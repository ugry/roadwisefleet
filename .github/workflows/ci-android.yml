name: ci-android

# Board #113 (AND1-CI) — run the Android test suites in CI and publish their
# reports. QA (#108) cannot run Android on an EILA host (no JDK/Android SDK, and
# Google's SDK/Maven endpoints are unreachable — see #108/#103); the runnable
# environment is a GitHub-hosted runner, which already carries Temurin 17 + the
# Android SDK and supports a KVM-accelerated headless AVD.
#
# This workflow is deliberately named `ci-android.yml` and NOT `android*.yml`:
# `android-release.yml` owns signing + Play distribution, and
# `infra/checks/android-release-check.sh` pins its secret-contract checks to the
# `android*.yml` release workflow. Keeping the test workflow out of that glob
# keeps the signing guard focused and this workflow free of signing concerns.
#
# Two jobs:
#   1. jvm-tests          — `:core:testDebugUnitTest` + `:app:testDebugUnitTest`
#                           (the JVM/Robolectric suite under
#                           `apps/android/core/src/test/`), plus `:app:assembleDebug`
#                           so the debug build stays green here too.
#   2. instrumented-tests — `:app:connectedDebugAndroidTest` on a headless AVD
#                           (API 35, google_apis). Step-level gated on the Tier-2
#                           device suites existing (#108 authoring / #114 commit),
#                           so it records a clean skip until they land rather
#                           than reddening CI.
#
# `.github/workflows/**` is a protected path: Team Leader review, owner merge.
# Nothing is deployed or installed by a merge; this is repo-side CI only.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/android/**'
      - '.github/workflows/ci-android.yml'

permissions:
  contents: read

# One run per ref is enough; a new push supersedes the previous run.
concurrency:
  group: ci-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-tests:
    name: JVM unit tests (core + app)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The three domain suites (TripCore, TrackingCore, Translator) are on
      # `main` but were never compiled or run anywhere before this job —
      # android-release.yml only assembles. `assembleDebug` is run alongside so
      # the debug build is exercised in CI on the same change.
      - name: Run the JVM unit tests + the debug build
        working-directory: apps/android
        run: ./gradlew --no-daemon :app:assembleDebug :core:testDebugUnitTest :app:testDebugUnitTest

      # Upload with `always()`: a failing suite is exactly when QA needs the
      # report, so the artifact must not be skipped on failure.
      - name: Upload the JVM test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-jvm-test-reports
          path: |
            apps/android/**/build/test-results/**
            apps/android/**/build/reports/tests/**
          if-no-files-found: warn
          retention-days: 14

  instrumented-tests:
    name: Instrumented tests (headless AVD, API 35)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Step-level gate, never a job-level `if` calling hashFiles():
      # hashFiles() needs the checked-out workspace, so GitHub rejects the whole
      # workflow file if it appears in a job-level expression (the board #109
      # incident). The Tier-2 device suites are authored on #108 and committed
      # with their Gradle deps on #114; until `app/src/androidTest` exists this
      # job is a clean, honest skip rather than a red build.
      - name: Are the device suites present?
        id: suites
        run: |
          if [ -d apps/android/app/src/androidTest ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::apps/android/app/src/androidTest is absent — the Tier-2 device suites (board #108, committed via #114) have not landed; skipping the instrumented suite"
          fi

      - uses: actions/setup-java@v4
        if: steps.suites.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.suites.outputs.present == 'true'

      # GitHub-hosted runners expose /dev/kvm but the default udev mode is
      # root-only; the emulator runs as the runner user, so grant it access.
      - name: Enable KVM
        if: steps.suites.outputs.present == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # API 35 / google_apis (not the Play Store image — no Google sign-in on a
      # headless runner). The AVD is created, booted and torn down by the action.
      - name: Run the instrumented suite on a headless AVD
        if: steps.suites.outputs.present == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: cd apps/android && ./gradlew --no-daemon :app:connectedDebugAndroidTest

      # `always() && present` so a failing/aborted run still publishes the XML
      # and HTML report QA must cite.
      - name: Upload the instrumented test reports
        if: always() && steps.suites.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumented-test-reports
          path: |
            apps/android/**/build/outputs/androidTest-results/**
            apps/android/**/build/reports/androidTests/**
          if-no-files-found: warn
          retention-days: 14
