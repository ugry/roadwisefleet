name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: OpenDesign lint (web artifacts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Clone OpenDesign
        run: git clone --depth 1 https://github.com/nexu-io/open-design.git /tmp/open-design

      - name: Install OpenDesign dependencies
        working-directory: /tmp/open-design
        run: |
          corepack enable
          pnpm install

      - name: Build OpenDesign daemon
        working-directory: /tmp/open-design
        run: pnpm --filter @open-design/daemon build

      - name: Start OpenDesign daemon (headless, for lint API)
        working-directory: /tmp/open-design
        run: |
          node apps/daemon/dist/cli.js --port 7456 --no-open > /tmp/od-daemon.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:7456/api/health > /dev/null; then
              echo "daemon up"; exit 0
            fi
            sleep 1
          done
          echo "daemon failed to start"; cat /tmp/od-daemon.log; exit 1

      - name: Lint artifacts (fail on P1+)
        run: |
          set -e
          # Only the design artifacts go through the OpenDesign linter;
          # diagrams.html is a Mermaid viewer, not a design artifact.
          for f in web/index.html web/dashboard.html web/driver-beacon-screen.html web/connect-load-posting.html; do
            echo "::group::lint $f"
            node /tmp/open-design/apps/daemon/dist/cli.js lint "$f" --fail-on p1 --daemon-url http://127.0.0.1:7456
            echo "::endgroup::"
          done

  api-tests:
    name: API tests (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Native Node test runner, no install step: the trip-status suite
      # (apps/api/src/trip-status.test.js, 10 tests) has no dependencies.
      - name: Run API tests
        run: node --test apps/api/src/

  # HTTP-level regression test for the tracking-link 414 defect (PR #25).
  # Needs the API dependencies (fastify, tsx), so it cannot run in the
  # no-install `api-tests` job; the dependency-free mirror of it is
  # apps/api/src/track-router.test.js, already covered by that job.
  api-router-tests:
    name: API router tests (app.inject)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        # Placeholder only — nothing connects to it. It exists so the apps/api
        # postinstall `prisma generate` has a value for the env("DATABASE_URL")
        # datasource in prisma/schema.prisma at install time.
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: pnpm install --frozen-lockfile

      - name: Run HTTP-level track-router tests
        run: pnpm --filter @roadwisefleet/api test:router

  deploy-pages:
    name: Deploy GitHub Pages (web/)
    if: github.ref == 'refs/heads/main'
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload web/ artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
