name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: OpenDesign lint (web artifacts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Clone OpenDesign
        run: git clone --depth 1 https://github.com/nexu-io/open-design.git /tmp/open-design

      - name: Install OpenDesign dependencies
        working-directory: /tmp/open-design
        run: |
          corepack enable
          pnpm install

      - name: Build OpenDesign daemon
        working-directory: /tmp/open-design
        run: pnpm --filter @open-design/daemon build

      - name: Start OpenDesign daemon (headless, for lint API)
        working-directory: /tmp/open-design
        run: |
          node apps/daemon/dist/cli.js --port 7456 --no-open > /tmp/od-daemon.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:7456/api/health > /dev/null; then
              echo "daemon up"; exit 0
            fi
            sleep 1
          done
          echo "daemon failed to start"; cat /tmp/od-daemon.log; exit 1

      - name: Lint artifacts (fail on P1+)
        run: |
          set -e
          # Only the design artifacts go through the OpenDesign linter;
          # diagrams.html is a Mermaid viewer, not a design artifact.
          for f in web/index.html web/dashboard.html web/driver-beacon-screen.html web/connect-load-posting.html; do
            echo "::group::lint $f"
            node /tmp/open-design/apps/daemon/dist/cli.js lint "$f" --fail-on p1 --daemon-url http://127.0.0.1:7456
            echo "::endgroup::"
          done

  api-tests:
    name: API tests (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Native Node test runner, no install step: the trip-status suite
      # (apps/api/src/trip-status.test.js, 10 tests) has no dependencies.
      - name: Run API tests
        run: node --test apps/api/src/

      # The waitlist microservice is dependency-free too. Its limiter was
      # effectively global behind nginx (board #45); these tests are the
      # per-client-IP proof, so they must run on every push.
      - name: Run waitlist service tests
        run: node --test services/waitlist/

  shellcheck:
    name: Shellcheck (infra scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Warning severity: catches real bugs (unquoted expansions, subshell
      # variable loss, parse errors) in the deploy/ops scripts that run on a
      # host, where CI previously validated nothing. Style-level noise is
      # filtered out; every script in the repo passes this gate today.
      - name: Run shellcheck (warning severity)
        run: |
          set -e
          mapfile -t files < <(git ls-files -z '*.sh' | tr '\0' '\n')
          echo "checking ${#files[@]} tracked shell scripts"
          shellcheck --severity=warning "${files[@]}"

  infra-scripts:
    name: Infra script self-tests (no host, no network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The ops scripts run on a host, so a syntax check is not evidence that
      # they behave. --self-test drives the real script (fixture nginx logs, a
      # stubbed systemctl + probe helper, DRY_RUN) and asserts the decisions the
      # acceptance criteria depend on: thresholds, exactly one alert per
      # incident, one recovery message, no alert while the API is down, and no
      # alert for a single restart. No host, no network, no root.
      - name: Self-test pilot-api-error-watch.sh (board #44)
        run: bash infra/scripts/pilot-api-error-watch.sh --self-test

      # Board #43: this is the check that makes a backup *verified* rather than
      # merely scheduled. It drives the real script against fixture backup sets
      # with a stub sendmail (every assertion reads the message actually sent)
      # and proves the acceptance-relevant decision: deleting the newest backup
      # is detected by the freshness check and raises exactly one alert.
      - name: Self-test pilot-backup-verify.sh (board #43)
        run: bash infra/scripts/pilot-backup-verify.sh --self-test

  restore-drill-selftest:
    name: Restore drill self-test (no host, no network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Board #62: the three restore-drill defects (stale UPLOAD_DIR in the
      # units, the SCRATCH_PORT=5433 collision with the host postgresql@17-main
      # cluster, and the missing dump-role bootstrap) were all found and patched
      # on the host AFTER the artifacts were merged, so CI had never validated
      # them. This drives the real script with a stubbed podman, a fixture
      # plain-SQL dump and a fixture uploads archive: no host, no network, no
      # root, no Postgres. The api-error-watch self-test lives in the
      # `infra-scripts` job (PR #37); once that lands the two can share a job.
      - name: Self-test pilot-restore-drill.sh (board #62)
        run: bash infra/scripts/pilot-restore-drill.sh --self-test

  pilot-csp-check:
    name: Pilot CSP vs. pilot assets (#65)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Board #65: the /pilot/ CSP was applied without 'self', so every
      # <script src="lib/..."> the pages load was blocked and the pilot never
      # booted in a browser. This job rejects a PR whose pilot policy does not
      # cover the resources the pilot HTML/JS actually declares (with CSP
      # fallback semantics), and rejects one that "boots" by relaxing the
      # lockdown. The self-test proves the checker catches the broken policy.
      - name: Self-test the checker (fixtures, no host, no network)
        run: bash infra/checks/pilot-csp-check.sh --self-test

      - name: Check the repo policy against the pilot assets
        run: bash infra/checks/pilot-csp-check.sh

  app-csp-check:
    name: App CSP vs. app assets (#69)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Board #69 / GitHub #48: /app/ gets its own policy, not the pilot one.
      # This rejects a PR whose app policy omits script-src 'self' (the app
      # shell would never boot, as in board #65/#39), one that reuses the pilot
      # snippet's 'unsafe-inline' while the app declares no inline code, and one
      # that "boots" by relaxing the lockdown. The self-test proves each.
      - name: Self-test the checker (fixtures, no host, no network)
        run: bash infra/checks/app-csp-check.sh --self-test

      - name: Check the repo policy against the app assets
        run: bash infra/checks/app-csp-check.sh

  deploy-pages:
    name: Deploy GitHub Pages (web/)
    if: github.ref == 'refs/heads/main'
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload web/ artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
